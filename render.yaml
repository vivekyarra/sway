# Render Blueprint (free tier): one web service (API + UI + background worker inline) and Postgres.
# New > Blueprint > pick this repo. Fill the "sync: false" secrets in the dashboard (without them Sway runs in
# PayPal test mode with its built-in reasoning engine). Register the PayPal webhook at
# https://<service>.onrender.com/api/webhooks/paypal and paste its id into PAYPAL_WEBHOOK_ID.
databases:
  - name: sway-db
    databaseName: sway
    user: sway
    plan: free

services:
  - type: web
    name: sway
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sway-db
          property: connectionString
      - key: WORKER_INLINE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: TEST_TOOLS
        value: "true"
      - key: VESTING_WINDOW_SECONDS
        value: "120"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_EMAIL
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_PASSWORD
        sync: false
      - key: CREATOR_PAYPAL_EMAILS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ATTRIBUTION_SAMPLES
        value: "1"
      - key: CHANNEL3_API_KEY
        sync: false

